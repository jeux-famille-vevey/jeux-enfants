<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>J'apprends à lire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{ --sun:#FFD23F; --tang:#FF9F1C; --ink:#FFF8E7; --soft:#C9CCF2; --night:#1D2357;
  --font:"Fredoka","Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;
  /* Andika : police faite pour apprendre à lire (a et g comme à l'école) */
  --lettre:"Andika","Comic Sans MS","Trebuchet MS",sans-serif; color-scheme:dark; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;color:var(--night);font-family:var(--font);user-select:none;-webkit-user-select:none}
html{background:#7FD3FF}
body{background:linear-gradient(#FFE8A3,#FFD0E6 50%,#BFE6FF)}
[hidden]{display:none !important}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.vue{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:14px 14px 18px;gap:12px;overflow:auto}
h1{margin:6px 0 0;font-size:clamp(2.2rem,7vw,3.6rem);color:#fff;text-shadow:0 4px 0 #FF8A3C,0 8px 20px rgba(0,0,0,.15);text-align:center;line-height:1}
.coin{position:fixed;top:10px;padding:9px 15px;border-radius:999px;background:rgba(29,35,87,.8);font-weight:600;text-decoration:none;color:var(--ink);font-size:1rem;z-index:5}
#profils{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#profils button{background:#fff;border-radius:999px;padding:8px 16px;font-weight:700;border:4px solid transparent;box-shadow:0 4px 0 rgba(29,35,87,.15)}
#profils button.on{border-color:#FF8A3C}
/* le chemin des étapes */
#chemin{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:min(760px,100%);margin-top:6px}
#chemin button{background:#fff;border-radius:28px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 7px 0 rgba(29,35,87,.18);border:4px solid transparent;font-weight:700;font-size:1.05rem;text-align:center}
#chemin button .num{background:#1D2357;color:#fff;border-radius:999px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:1rem}
#chemin button .e{font-size:2.8rem;line-height:1.1}
#chemin button small{font-weight:500;color:#5A5F8F;font-size:.85rem}
#chemin button .et{font-size:1.2rem;letter-spacing:2px}
@media (max-width:620px){ #chemin{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* découverte : les cartes à toucher */
#titreEtape{margin:44px 0 0;font-size:clamp(1.6rem,5vw,2.4rem);font-weight:700;text-align:center}
#cartes{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:900px}
.carteL{background:#fff;border-radius:26px;min-width:130px;padding:12px 16px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 7px 0 rgba(29,35,87,.18);border:4px solid transparent}
.carteL .lettre{font-family:var(--lettre);font-size:4.4rem;line-height:1;font-weight:700;color:#3D7BD9}
.carteL .img{font-size:2.2rem}
.carteL small{font-size:.95rem;font-weight:600;color:#5A5F8F}
.carteL.on{border-color:var(--sun);transform:scale(1.06)}
.carteL.vu{background:#F2FFF4}
.fusion{display:flex;align-items:center;gap:22px;transition:gap .5s}
.fusion b{font-family:var(--lettre);font-size:3.6rem;line-height:1;transition:transform .5s}
.fusion b.c{color:#E5484D}.fusion b.v{color:#3D7BD9}
.carteL.colle .fusion{gap:0}
/* questions */
#question{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:900px;margin-top:40px}
#consigne{font-size:clamp(1.3rem,4vw,1.9rem);font-weight:700;text-align:center;min-height:2.4rem}
#modele{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#modele span{font-family:var(--lettre);background:#fff;border-radius:18px;padding:6px 16px;font-size:clamp(2.6rem,9vw,4.4rem);font-weight:700;line-height:1.1;box-shadow:0 6px 0 rgba(29,35,87,.16);cursor:pointer}
#modele span:nth-child(odd){color:#E5484D}#modele span:nth-child(even){color:#3D7BD9}
#modele span.on{background:var(--sun)}
#modele.phrase span{font-size:clamp(1.8rem,6vw,2.8rem);color:#1D2357 !important}
#modele .ecouter{font-family:var(--font);font-size:2rem;background:#1D2357;color:#fff !important}
#choix{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
#choix button{background:#fff;border-radius:28px;min-width:clamp(110px,24vw,170px);min-height:clamp(110px,24vw,170px);padding:10px 16px;font-family:var(--lettre);font-weight:700;font-size:clamp(3rem,10vw,5rem);line-height:1;color:#1D2357;box-shadow:0 8px 0 rgba(29,35,87,.18);border:5px solid transparent}
#choix button.img{font-family:var(--font);font-size:clamp(2.6rem,9vw,4.2rem)}
#choix button.bon{border-color:#3FA34D;background:#E8FFEC}
#choix button.non{animation:non .4s}
@keyframes non{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
#etoilesQ{position:fixed;top:12px;left:50%;transform:translateX(-50%);font-size:1.6rem;letter-spacing:2px;white-space:nowrap;background:rgba(255,255,255,.7);border-radius:999px;padding:2px 12px}
.gros{padding:14px 34px;border-radius:999px;font-size:1.5rem;font-weight:700;color:var(--night);background:linear-gradient(100deg,var(--sun),var(--tang));box-shadow:0 7px 0 #c9771a}
.gros:active{transform:translateY(4px);box-shadow:0 3px 0 #c9771a}
#fete{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#fete span{position:absolute;top:-10%;font-size:2.2rem;animation:tombe linear forwards}
@keyframes tombe{to{transform:translateY(120vh) rotate(540deg)}}
</style>
</head>
<body>
<div class="vue" id="vCarte">
  <h1>J'apprends à lire 📖</h1>
  <div id="profils"></div>
  <div id="chemin"></div>
  <a class="coin" style="left:10px" href="../">🏠 Les jeux</a>
</div>

<div class="vue" id="vDecouverte" hidden>
  <div id="titreEtape"></div>
  <div id="cartes"></div>
  <button class="gros" id="pret">✅ Je suis prêt !</button>
  <button class="coin" style="left:10px" id="retour1">🗺️</button>
</div>

<div class="vue" id="vQuestion" hidden>
  <div id="etoilesQ"></div>
  <div id="question">
    <div id="consigne"></div>
    <div id="modele"></div>
    <div id="choix"></div>
  </div>
  <button class="coin" style="left:10px" id="retour2">🗺️</button>
  <button class="coin" style="right:10px" id="reecouter">🔊 Réécouter</button>
</div>

<div class="vue" id="vFin" hidden style="justify-content:center">
  <h1 id="finTitre">Bravo !</h1>
  <div id="finEtoiles" style="font-size:5rem;letter-spacing:8px">⭐⭐⭐</div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
    <button class="gros" id="suivante">▶ Étape suivante</button>
    <button class="gros" style="background:#fff;box-shadow:0 7px 0 rgba(29,35,87,.2)" id="refaire">🔁 Refaire</button>
  </div>
  <button class="coin" style="left:10px" id="retour3">🗺️</button>
</div>
<div id="fete"></div>

<script src="donnees.js"></script>
<script src="jeu.js"></script>
</body>
</html>
