<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test de connexion – Pirates</title>
<style>
:root{ color-scheme: dark; }
body{margin:0;background:#1D2357;color:#FFF8E7;font-family:"Trebuchet MS",system-ui,sans-serif;padding:16px;line-height:1.45}
h1{color:#FFD23F;font-size:1.6rem;margin:4px 0 8px}
.l{display:flex;gap:10px;align-items:flex-start;background:#272C6B;border-radius:14px;padding:10px 12px;margin:8px 0;font-size:1.05rem}
.l b{font-size:1.4rem;line-height:1.2;min-width:1.6em;text-align:center}
.l small{display:block;color:#C9CCF2}
#bilan{font-size:1.25rem;font-weight:700;margin:14px 0;padding:12px;border-radius:14px;background:#3A429A}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:10px 18px;background:#FFD23F;color:#1D2357;cursor:pointer}
a{color:#7FD3FF}
</style>
</head>
<body>
<h1>🏴‍☠️ Test de connexion</h1>
<p>Cette page vérifie si cet appareil peut jouer à plusieurs. Attends 15 secondes, puis prends une photo de l'écran.</p>
<div id="lignes"></div>
<div id="bilan">Test en cours…</div>
<button onclick="location.reload()">🔁 Refaire le test</button> &nbsp; <a href="./">← Retour au jeu</a>
<script type="module">
import mqtt from "./lib/mqtt.esm.js";
const box = document.getElementById("lignes");
function ligne(txt){ const d = document.createElement("div"); d.className = "l"; d.innerHTML = "<b>⏳</b><div></div>"; d.lastChild.textContent = txt; box.appendChild(d);
  return (ok, detail) => { d.firstChild.textContent = ok === true ? "✅" : ok === false ? "❌" : "⚠️"; if(detail){ const s = document.createElement("small"); s.textContent = detail; d.lastChild.appendChild(s); } }; }
const resultats = {};
(async () => {
  ligne("Version du jeu : 3 (" + new Date().toLocaleString("fr-CH") + ")")(true, navigator.userAgent);
  ligne("Internet")(navigator.onLine, navigator.onLine ? "connecté" : "pas de connexion");
  const crypt = !!(window.crypto && crypto.subtle && window.isSecureContext);
  ligne("Chiffrement des messages")(crypt, crypt ? "disponible" : "indisponible : ouvre le jeu par l'adresse https://…");
  const SERVICES = [["HiveMQ", "wss://broker.hivemq.com:8884/mqtt"], ["EMQX", "wss://broker.emqx.io:8084/mqtt"], ["Mosquitto", "wss://test.mosquitto.org:8081"]];
  await Promise.all(SERVICES.map(([nom, url]) => new Promise((fin) => {
    const maj = ligne("Service " + nom);
    const t0 = performance.now(), sujet = "jfv-pirates-v1/test-" + Math.random().toString(36).slice(2, 10);
    let fait = false;
    const finir = (ok, d) => { if(fait) return; fait = true; resultats[nom] = ok; maj(ok, d); try{ c.end(true); }catch(e){} fin(); };
    let c;
    try{ c = mqtt.connect(url, { connectTimeout: 10000, reconnectPeriod: 0, clientId: "jfv-test-" + Math.random().toString(36).slice(2, 8) }); }
    catch(e){ return finir(false, "erreur : " + e.message); }
    c.on("connect", () => {
      const t1 = Math.round(performance.now() - t0);
      c.subscribe(sujet, (err) => {
        if(err) return finir(false, "connecté mais abonnement refusé");
        const t2 = performance.now();
        c.publish(sujet, "bonjour");
        c.on("message", () => finir(true, "connecté en " + t1 + " ms, message reçu en " + Math.round(performance.now() - t2) + " ms"));
        setTimeout(() => finir(false, "connecté, mais le message n'est pas revenu"), 6000);
      });
    });
    c.on("error", (e) => finir(false, "erreur : " + (e && e.message || e)));
    setTimeout(() => finir(false, "aucune réponse en 12 secondes (bloqué par le réseau ?)"), 12000);
  })));
  const nb = Object.values(resultats).filter(Boolean).length;
  document.getElementById("bilan").textContent = nb >= 1 && crypt
    ? "✅ Cet appareil peut jouer à plusieurs (" + nb + " service" + (nb > 1 ? "s" : "") + " sur 3)."
    : "❌ Cet appareil ne peut pas joindre les services de connexion. Envoie une photo de cet écran.";
})();
</script>
</body>
</html>
