<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Super Parc 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{ --sun:#FFD23F; --tang:#FF9F1C; --ink:#FFF8E7; --soft:#C9CCF2; --night:#1D2357; --panel:rgba(29,35,87,.84);
  --font:"Fredoka","Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif; color-scheme:dark; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#9ED8FF;color:var(--ink);font-family:var(--font);user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
[hidden]{display:none !important}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.rond{background:var(--panel);border-radius:999px;padding:9px 15px;font-weight:700;text-decoration:none;color:var(--ink);font-size:1.02rem}

#menu{position:fixed;inset:0;display:flex;pointer-events:none}
#menu .panneau{pointer-events:auto;width:min(500px,100%);height:100%;overflow:auto;padding:16px 20px 24px;background:linear-gradient(90deg,rgba(29,35,87,.96),rgba(29,35,87,.88) 82%,rgba(29,35,87,0))}
#menu h1{margin:46px 0 2px;font-size:clamp(2.1rem,6vw,3rem);line-height:1;color:var(--sun);text-shadow:0 4px 0 var(--tang)}
#menu .sous{margin:8px 0 10px;color:var(--soft);font-size:1.05rem;line-height:1.4}
#menu h2{font-size:1.02rem;margin:14px 0 7px;color:var(--soft);font-weight:600}
.puces{display:flex;flex-wrap:wrap;gap:8px}
.puces button{background:#2E3580;border-radius:16px;padding:9px 13px;font-weight:600;font-size:1.02rem;border:3px solid transparent}
.puces button.on{border-color:var(--sun);background:#3A429A}
.gros{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-radius:20px;padding:12px 16px;margin:7px 0;font-weight:700;font-size:1.3rem;color:var(--night);background:linear-gradient(100deg,#FFD23F,#FF9F1C);box-shadow:0 5px 0 #C9771A}
.gros .e{font-size:2.2rem}
.gros small{display:block;font-weight:500;font-size:.9rem;opacity:.85}
.gros.bleu{background:linear-gradient(100deg,#7FD3FF,#4CC9F0);box-shadow:0 5px 0 #2B8FB5}
.gros:active{transform:translateY(3px)}
.aide{margin-top:12px;color:var(--soft);font-size:.95rem;line-height:1.55}
.aide b{color:var(--ink)}
#accueil{position:fixed;top:12px;left:14px;pointer-events:auto}

#hud{position:fixed;inset:0;pointer-events:none}
#haut{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
#haut .rond{pointer-events:auto}
#score{background:var(--panel);border-radius:18px;padding:8px 14px;font-weight:700;font-size:1.25rem;display:flex;gap:10px;align-items:center}
#score .moi{color:#7FD3FF}#score .eux{color:#FF8A8A}
#etoiles{background:var(--panel);border-radius:18px;padding:8px 14px;font-weight:700;font-size:1.25rem}
#message{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);font-size:clamp(2rem,7vw,4rem);font-weight:700;color:var(--sun);text-shadow:0 4px 0 var(--tang),0 0 20px rgba(0,0,0,.4);opacity:0;transition:opacity .3s;text-align:center;white-space:nowrap}
#message.on{opacity:1}
#astuce{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:var(--panel);border-radius:999px;padding:8px 16px;font-weight:600;max-width:92vw;text-align:center;transition:opacity .4s}
#jauge{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);width:200px;height:14px;border-radius:999px;background:rgba(29,35,87,.6);overflow:hidden;opacity:0;transition:opacity .2s}
#jauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7FD3FF,#FFD23F,#FF6F9F)}
#jauge.on{opacity:1}

#tactile{position:fixed;inset:0;pointer-events:none}
#joy{position:absolute;left:24px;bottom:24px;width:140px;height:140px;border-radius:50%;background:rgba(29,35,87,.35);border:3px solid rgba(255,255,255,.55);pointer-events:auto;touch-action:none;display:grid;place-items:center}
#joy i{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.85);display:block}
.tb{position:absolute;width:78px;height:78px;border-radius:50%;background:rgba(29,35,87,.6);border:3px solid rgba(255,255,255,.6);font-size:2rem;pointer-events:auto;touch-action:none;display:grid;place-items:center}
.tb small{position:absolute;bottom:-18px;font-size:.75rem;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap}
#tSaut{right:24px;bottom:30px;width:92px;height:92px}
#tFrappe{right:130px;bottom:24px}
#tCourse{right:30px;bottom:150px}
#tMonter{right:130px;bottom:130px}
#tCourse.on{background:var(--sun)}
@media (max-height:520px){ #menu h1{margin-top:10px} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu">
  <div class="panneau">
    <h1>⚡ Super Parc 3D</h1>
    <p class="sous">Cours à toute vitesse, saute jusqu'au ciel, pousse le ballon géant dans les buts, fais tomber les Costauds, descends les toboggans géants et fonce en jet-ski sur le lac !</p>
    <h2>Qui joue ?</h2>
    <div class="puces" id="profils"></div>
    <button class="gros" id="jouer"><span class="e">⚡</span><span>Jouer !<small>Marque 5 buts avant les Costauds</small></span></button>
    <button class="gros bleu" id="monPerso"><span class="e">🧑‍🎨</span><span>Mon personnage<small>Les habits, les couleurs, les accessoires…</small></span></button>
    <p class="aide" id="aide"></p>
  </div>
  <a class="rond" id="accueil" href="../">🏠 Tous les jeux</a>
</div>

<div id="hud" hidden>
  <div id="haut">
    <button class="rond" id="versMenu">⬅️ Menu</button>
    <div id="score"><span class="moi">⚽ Toi <b id="sMoi">0</b></span><span>–</span><span class="eux"><b id="sEux">0</b> Costauds 💪</span></div>
    <div id="etoiles">⭐ <b id="nEtoiles">0</b>/<span id="totEtoiles">0</span></div>
    <button class="rond" id="sonBtn" aria-label="Le son">🔊</button>
  </div>
  <div id="message"></div>
  <div id="jauge"><i></i></div>
  <div id="astuce"></div>
</div>
<div id="tactile" hidden>
  <div id="joy"><i></i></div>
  <button class="tb" id="tSaut" aria-label="Sauter">🦘<small>super saut</small></button>
  <button class="tb" id="tFrappe" aria-label="Frapper">💥<small>frapper</small></button>
  <button class="tb" id="tCourse" aria-label="Super vitesse">⚡<small>vitesse</small></button>
  <button class="tb" id="tMonter" aria-label="Jet-ski" hidden>🚤<small>jet-ski</small></button>
</div>
<script type="module" src="jeu.js?v=1"></script>
</body>
</html>
