<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>La Course des Bouées</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{ --sun:#FFD23F; --tang:#FF9F1C; --ink:#FFF8E7; --soft:#C9CCF2; --night:#1D2357; --panel:rgba(29,35,87,.84);
  --font:"Fredoka","Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif; color-scheme:dark; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#8FD6FF;color:var(--ink);font-family:var(--font);user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
[hidden]{display:none !important}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.rond{background:var(--panel);border-radius:999px;padding:9px 15px;font-weight:700;text-decoration:none;color:var(--ink);font-size:1.02rem}

#menu{position:fixed;inset:0;display:flex;pointer-events:none}
#menu .panneau{pointer-events:auto;width:min(500px,100%);height:100%;overflow:auto;padding:16px 20px 24px;background:linear-gradient(90deg,rgba(29,35,87,.95),rgba(29,35,87,.86) 82%,rgba(29,35,87,0))}
#menu h1{margin:46px 0 2px;font-size:clamp(2rem,6vw,2.9rem);line-height:1.05;color:var(--sun);text-shadow:0 4px 0 var(--tang)}
#menu .sous{margin:8px 0 10px;color:var(--soft);font-size:1.05rem;line-height:1.4}
#menu h2{font-size:1.02rem;margin:14px 0 7px;color:var(--soft);font-weight:600}
.puces{display:flex;flex-wrap:wrap;gap:8px}
.puces button{background:#2E3580;border-radius:16px;padding:9px 13px;font-weight:600;font-size:1.02rem;border:3px solid transparent}
.puces button.on{border-color:var(--sun);background:#3A429A}
.gros{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-radius:20px;padding:12px 16px;margin:7px 0;font-weight:700;font-size:1.3rem;color:var(--night);background:linear-gradient(100deg,#FFD23F,#FF9F1C);box-shadow:0 5px 0 #C9771A}
.gros .e{font-size:2.2rem}
.gros small{display:block;font-weight:500;font-size:.9rem;opacity:.85}
.gros.bleu{background:linear-gradient(100deg,#7FD3FF,#4CC9F0);box-shadow:0 5px 0 #2B8FB5}
.gros.vert{background:linear-gradient(100deg,#9BE07A,#3FCF6A);box-shadow:0 5px 0 #2C9A4E}
.gros:active{transform:translateY(3px)}
.aide{margin-top:12px;color:var(--soft);font-size:.95rem;line-height:1.55}
.aide b{color:var(--ink)}
#pieces{display:inline-block;margin-top:4px;background:#2E3580;border-radius:999px;padding:5px 12px;font-weight:700}
#accueil{position:fixed;top:12px;left:14px;pointer-events:auto}

#hud{position:fixed;inset:0;pointer-events:none}
#haut{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:flex-start}
#haut .rond{pointer-events:auto}
#manche{background:var(--panel);border-radius:16px;padding:7px 13px;font-weight:700;font-size:1rem;margin-left:auto}
#place{position:absolute;top:58px;left:50%;transform:translateX(-50%) skewX(-10deg);font-size:clamp(3rem,11vw,5.2rem);font-weight:700;font-style:italic;color:#fff;text-shadow:0 4px 0 #3B3FCF,0 0 14px rgba(0,0,0,.25);line-height:1}
#place sup{font-size:.45em;vertical-align:top;margin-left:2px}
#gain{position:absolute;top:60px;right:12px;background:var(--panel);border-radius:14px;padding:6px 11px;font-weight:700}
#message{position:absolute;top:27%;left:50%;transform:translate(-50%,-50%);font-size:clamp(1.8rem,7vw,3.6rem);font-weight:700;color:var(--sun);text-shadow:0 4px 0 var(--tang),0 0 18px rgba(0,0,0,.35);opacity:0;transition:opacity .25s;text-align:center;white-space:nowrap}
#message.on{opacity:1}
@media (max-width:600px){ #place{top:72px} #gain{top:76px} #manche{font-size:.9rem} }
#decompte{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:clamp(5rem,26vw,11rem);font-weight:700;color:#FFF35C;text-shadow:0 7px 0 #8E5BC4,0 0 30px rgba(0,0,0,.3)}
#astuce{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel);border-radius:999px;padding:8px 16px;font-weight:600;max-width:92vw;text-align:center;transition:opacity .5s}

#fin{position:fixed;inset:0;display:grid;place-items:center;background:rgba(29,35,87,.55);padding:16px}
#fin .boite{background:var(--night);border-radius:26px;padding:18px 20px 20px;width:min(440px,100%);text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35);max-height:100%;overflow:auto}
#finPlace{display:inline-grid;place-items:center;width:110px;height:110px;margin:4px auto 0;font-size:2.6rem;font-weight:700;color:#7A4A00;background:linear-gradient(#FFE27A,#FFB400);clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)}
#finTitre{font-size:2rem;font-weight:700;margin:8px 0 2px}
#finTitre.ok{color:#7BE495}#finTitre.non{color:#FF9F9F}
#finTexte{color:var(--soft);margin:4px 0 10px;line-height:1.4}
#finDetail{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:left;background:#272C6B;border-radius:16px;padding:10px 14px;margin:8px 0 12px;font-weight:600}
#finDetail b{text-align:right;color:var(--sun)}
#classement{display:flex;flex-direction:column;gap:3px;text-align:left;max-height:150px;overflow:auto;margin:0 0 10px;font-size:.95rem}
#classement div{background:#272C6B;border-radius:10px;padding:4px 10px}
#classement div.moi{background:#3FCF6A;color:var(--night);font-weight:700}
#classement div.dehors{opacity:.55}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu">
  <div class="panneau">
    <h1>🛟 La Course des Bouées</h1>
    <p class="sous">Glisse sur le toboggan géant dans ta bouée, pousse les autres pour les faire tomber, envole-toi par-dessus le bord pour couper… et atterris au milieu de la piscine !</p>
    <h2>Qui joue ?</h2>
    <div class="puces" id="profils"></div>
    <span id="pieces">🪙 0</span>
    <button class="gros" id="jouer"><span class="e">🏆</span><span>La Coupe de la Plage<small>3 manches : qualifie-toi jusqu'à la finale</small></span></button>
    <button class="gros vert" id="libre"><span class="e">🛟</span><span>Une course pour s'amuser<small>Sans élimination</small></span></button>
    <button class="gros bleu" id="monPerso"><span class="e">🧑‍🎨</span><span>Mon personnage<small>Les habits, les couleurs, les accessoires…</small></span></button>
    <p class="aide" id="aide"></p>
  </div>
  <a class="rond" id="accueil" href="../">🏠 Tous les jeux</a>
</div>

<div id="hud" hidden>
  <div id="haut">
    <button class="rond" id="versMenu">⬅️ Menu</button>
    <button class="rond" id="sonBtn" aria-label="Le son">🔊</button>
    <div id="manche"></div>
  </div>
  <div id="place">16<sup>e</sup></div>
  <div id="gain">🪙 0</div>
  <div id="message"></div>
  <div id="decompte"></div>
  <div id="astuce"></div>
</div>

<div id="fin" hidden>
  <div class="boite">
    <div id="finPlace">1<sup>er</sup></div>
    <div id="finTitre">Qualifié !</div>
    <p id="finTexte"></p>
    <div id="finDetail"></div>
    <div id="classement"></div>
    <button class="gros" id="finSuite"><span class="e">➡️</span><span>Manche suivante</span></button>
    <button class="gros bleu" id="finMenu"><span class="e">🏠</span><span>Menu</span></button>
  </div>
</div>
<script type="module" src="jeu.js?v=1"></script>
</body>
</html>
